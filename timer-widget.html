<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --u:min(1vw,1.86vh); --green:#53fc18; --yellow:#ffcf4a; --red:#ff5b69; --muted:#8c9893; }
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#f3f6f4;height:100%}
  .box{position:absolute;inset:8px;border-radius:calc(var(--u)*3);background:rgba(8,10,12,.96);border:1px solid #2a3235;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(var(--u)*.6);padding:calc(var(--u)*2) calc(var(--u)*3);overflow:hidden}
  .label{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(var(--u)*6.2);letter-spacing:.16em;text-transform:uppercase;color:#d4dcd8}
  .time{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(var(--u)*20);line-height:.95;letter-spacing:.02em;color:var(--green);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(83,252,24,.35);transition:color .3s}
  .cta{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:calc(var(--u)*4.5);letter-spacing:.03em;text-transform:uppercase;color:#fff;margin-top:calc(var(--u)*1.2);text-align:center;white-space:nowrap}
  .cta b{color:var(--green)}
  .bar{position:absolute;left:0;bottom:0;height:calc(var(--u)*1.4);background:var(--green);width:100%;transition:width .25s linear,background .3s}
  .box.warn .time{color:var(--yellow);text-shadow:0 0 22px rgba(255,207,74,.35)} .box.warn .bar{background:var(--yellow)}
  .box.hot .time{color:var(--red);text-shadow:0 0 22px rgba(255,91,105,.45);animation:pulse 1s infinite} .box.hot .bar{background:var(--red)}
  .box.go .time{color:var(--green);font-size:calc(var(--u)*18);animation:pulse .7s infinite}
  .box.paused .label::after{content:" · paused";color:var(--yellow)}
  @keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<div class="box" id="box"><div class="label" id="label">Giveaway Timer</div><div class="time" id="time">15:00</div><div class="cta" id="cta"></div><div class="bar" id="bar"></div></div>
<script>
/*
  OBS browser source. Suggested size 520 x 280.
  Change it with the end of the URL:
    ?type=giveaway     shows "Giveaway Timer"      (default)
    ?type=cash         shows "Cash Drop Timer"
    ?text=Anything     shows your own words (overrides type)
    ?cta=Your line     the line under the timer (default: Type YO in chat for free money)
    ?cta=              empty = hide that line
    ?min=15            minutes (default 15)
    ?hold=30           seconds to stay on NOW! before restarting (default 30)
    ?sound=0           mute the alarm (default: alarm plays at 0 and repeats every 7s while NOW! shows)
    ?vol=0.6           alarm volume 0 to 1 (default 0.6)
    ?loop=0            stop at 0 instead of restarting (default restarts automatically)
  Controls (right-click the source in OBS > Interact, then click the page, or use these keys):
    R = restart   P = pause / resume   (double-click the page also restarts)   T = test the alarm sound
*/
const qs = new URLSearchParams(location.search);
const MIN = Math.max(1, Math.min(180, Number(qs.get('min')) || 15)), LEN = MIN * 60 * 1000;
const LOOP = qs.get('loop') !== '0';
const HOLD = Math.max(3, Math.min(300, qs.has('hold') ? Number(qs.get('hold')) : 30)) * 1000;
const SOUND = qs.get('sound') !== '0', VOL = Math.max(0, Math.min(1, qs.has('vol') ? Number(qs.get('vol')) : 0.6));
let actx = null, lastRing = 0;
function ring(){
  if(!SOUND || VOL <= 0) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.05, master = actx.createGain(); master.gain.value = VOL; master.connect(actx.destination);
    // three rising two-tone alarm bursts
    for(let b = 0; b < 3; b++){
      [880, 1175].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain(), t = t0 + b * 0.62 + i * 0.2;
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
      });
    }
  }catch(e){ /* audio blocked: the visual still works */ }
}
const TEXT = qs.get('text') || (qs.get('type') === 'cash' ? 'Cash Drop Timer' : 'Giveaway Timer');
const KEY = 'zy_timer_' + MIN;
const $ = id => document.getElementById(id);
$('label').textContent = TEXT; document.title = TEXT;
const CTA = qs.has('cta') ? qs.get('cta') : 'Type YO in chat for free money';
if(CTA){ $('cta').innerHTML = CTA.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])).replace(/\b(YO)\b/, '<b>$1</b>'); } else { $('cta').style.display = 'none'; }
let S;
function load(){ try{ const j = JSON.parse(localStorage.getItem(KEY)); if(j && typeof j.end === 'number') return j; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function restart(){ S = { end: Date.now() + LEN, paused: false, left: LEN }; lastRing = 0; save(); }
S = load() || { end: Date.now() + LEN, paused: false, left: LEN };
if(!load()) save();
const pad = n => String(n).padStart(2, '0');
function tick(){
  let left = S.paused ? S.left : S.end - Date.now();
  if(left <= -HOLD){ if(LOOP){ restart(); left = LEN; } else left = 0; }
  const box = $('box');
  box.classList.toggle('paused', !!S.paused);
  if(left <= 0){
    if(!S.paused && Date.now() - lastRing >= 7000){ lastRing = Date.now(); ring(); }
    box.className = 'box go' + (S.paused ? ' paused' : '');
    $('time').textContent = LOOP || left > -HOLD ? 'NOW!' : '00:00'; $('bar').style.width = '0%';
    return;
  }
  const secs = Math.ceil(left / 1000), m = Math.floor(secs / 60), s = secs % 60;
  $('time').textContent = pad(m) + ':' + pad(s);
  $('bar').style.width = Math.max(0, Math.min(100, left / LEN * 100)) + '%';
  box.className = 'box' + (secs <= 10 ? ' hot' : secs <= 60 ? ' warn' : '') + (S.paused ? ' paused' : '');
}
function togglePause(){ if(S.paused){ S.end = Date.now() + S.left; S.paused = false; } else { S.left = Math.max(0, S.end - Date.now()); S.paused = true; } save(); tick(); }
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if(k === 'r'){ restart(); tick(); } else if(k === 'p'){ togglePause(); } });
document.addEventListener('dblclick', () => { restart(); tick(); });
addEventListener('keydown', e => { if(e.key.toLowerCase() === 't'){ lastRing = Date.now(); ring(); } });  // T = test the alarm
tick(); setInterval(tick, 250);
</script>
</body>
</html>
