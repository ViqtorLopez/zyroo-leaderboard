<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Giveaway Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plate-1:#1c2733;
    --plate-2:#0e141c;
    --navy:#0d1520;
    --navy-2:#090e16;
    --gold:#f0b429;
    --gold-hi:#ffdf8a;
    --text:#eef2f6;
    --muted:#7c8797;
    --cycle:13s;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:transparent;overflow:hidden;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}

  .dock{width:480px;height:186px;}

  .roll-wrap{
    position:relative;
    width:34px;height:100%;
    overflow:hidden;
    border-radius:14px;
    animation: rollWidth var(--cycle) cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes rollWidth{
    0%    { width:34px; }
    16%   { width:34px; }
    30%   { width:480px; }
    74%   { width:480px; }
    90%   { width:34px; }
    100%  { width:34px; }
  }

  .ticket{
    position:relative;width:480px;height:100%;
    display:flex;
    background:linear-gradient(155deg, var(--navy), var(--navy-2));
    -webkit-mask-image:
      linear-gradient(#000,#000),
      radial-gradient(circle 11px at 92px 0px, #000 100%, transparent 100%);
    -webkit-mask-composite: source-over, destination-out;
    mask-image:
      linear-gradient(#000,#000),
      radial-gradient(circle 11px at 92px 0px, #000 100%, transparent 100%);
    mask-composite: add, subtract;
  }

  .roll-cap{
    position:absolute;top:0;right:0;width:34px;height:100%;
    border-radius:50%/50%;
    background: #1b2b38;
    box-shadow:2px 0 8px rgba(0,0,0,0.45);
    z-index:5;
    animation: capFade var(--cycle) cubic-bezier(.4,0,.2,1) infinite;
    display:flex;align-items:center;justify-content:center;
  }
  .roll-cap::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(90deg, rgba(0,0,0,0.40), transparent 30%, rgba(255,255,255,0.30) 50%, transparent 70%, rgba(0,0,0,0.40));
  }
  .cap-label{
    position:relative;z-index:2;
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:.14em;color:var(--gold);text-transform:uppercase;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  @keyframes capFade{
    0%   { opacity:1; }
    29%  { opacity:1; }
    31%  { opacity:0; }
    73%  { opacity:0; }
    75%  { opacity:1; }
    100% { opacity:1; }
  }

  .stub{
    width:92px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg, #121a24, #0a0f16);
    border-right:1.5px dashed rgba(240,180,41,0.35);
  }
  .stub-label{
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:22px;
    letter-spacing:.18em;color:var(--gold);
    text-transform:uppercase;
  }

  .main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:14px 20px;
  }

  .readout{display:flex;gap:6px;align-items:center;}
  .cell{
    width:52px;height:78px;border-radius:8px;
    background:linear-gradient(160deg, var(--plate-1), var(--plate-2));
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:inset 0 2px 0 rgba(255,255,255,0.05), inset 0 -6px 10px rgba(0,0,0,0.4);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
    flex-shrink:0;
  }
  .cell::after{
    content:'';position:absolute;left:0;right:0;top:50%;height:1px;
    background:rgba(0,0,0,0.5);
  }
  .cell .digit{
    font-family:'JetBrains Mono', monospace;font-weight:800;font-size:40px;
    color:var(--text);
  }
  .cell.sign .digit{color:var(--gold);font-size:34px;}

  .caption{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
    letter-spacing:.14em;color:var(--muted);text-transform:uppercase;
    white-space:nowrap;
  }

  .enter-line{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
    color:var(--gold-hi);
    border-bottom:1.5px solid rgba(240,180,41,0.5);
    padding-bottom:2px;
    white-space:nowrap;
  }

  .sweep{
    position:absolute;top:0;left:-40%;width:35%;height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.10), transparent);
    transform:skewX(-16deg);
    animation:sweepMove var(--cycle) ease-in-out infinite;
  }
  @keyframes sweepMove{
    0%{ left:-40%; }
    34%{ left:-40%; }
    50%{ left:130%; }
    100%{ left:130%; }
  }
</style>
</head>
<body>

<div class="dock">
  <div class="roll-wrap" id="rollWrap">
    <div class="ticket">
      <div class="sweep"></div>
      <div class="stub">
        <div class="stub-label">Giveaway</div>
      </div>
      <div class="main">
        <div class="readout" id="readout">
          <div class="cell sign"><div class="digit">$</div></div>
          <div class="cell"><div class="digit" data-target="5">0</div></div>
          <div class="cell"><div class="digit" data-target="0">0</div></div>
          <div class="cell"><div class="digit" data-target="0">0</div></div>
        </div>
        <div class="caption">Prize Pool</div>
        <div class="enter-line">Sign up on Stake to enter</div>
      </div>
    </div>
    <div class="roll-cap"><span class="cap-label">Giveaway</span></div>
  </div>
</div>

<script>
  const digitCells = document.querySelectorAll('.cell:not(.sign) .digit');
  const CYCLE_MS = 13000;
  const UNROLL_COMPLETE_MS = CYCLE_MS * 0.34;

  function spinDigit(el, finalDigit, delay){
    const spins = 10;
    let i = 0;
    setTimeout(()=>{
      const iv = setInterval(()=>{
        i++;
        if(i < spins){
          el.textContent = Math.floor(Math.random()*10);
        } else {
          el.textContent = finalDigit;
          clearInterval(iv);
        }
      }, 55);
    }, delay);
  }

  function playReveal(){
    digitCells.forEach((el, idx)=>{
      spinDigit(el, el.dataset.target, idx * 110);
    });
  }

  setTimeout(playReveal, UNROLL_COMPLETE_MS);
  setInterval(()=> setTimeout(playReveal, UNROLL_COMPLETE_MS), CYCLE_MS);
</script>
</body>
</html>
